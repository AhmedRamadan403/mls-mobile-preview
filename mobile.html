/* MLS-MOBILE-SURFACE-POLISH */
/* Both explicit dark mode and automatic dark mode use the same surface tokens. */
:is(#modal>.sheet,.sh>div,.action-sheet-panel){background:var(--card);color:var(--ink);border:1px solid var(--ln)}
:is(#modal,.sh,.action-sheet-panel) :is(input,textarea,select,.opt,.action-sheet-option){background:var(--bg);color:var(--ink);border-color:var(--ln)}
:is(#modal,.sh,.action-sheet-panel) :is(select option,.action-sheet-cancel){background:var(--card);color:var(--ink)}
:is(#modal,.sh,.action-sheet-panel) :is(.muted,.mu,.help,small){color:var(--mu)}
:is(#modal,#rd-mobile-form) :is(.modal,.modal-head,.modal-foot,.modal-footer,.form-actions,.evidence-item,.doc-picker-header,.doc-picker-copy){background:var(--card);color:var(--ink);border-color:var(--ln)}
:is(#modal,#rd-mobile-form) :is(input,textarea,select){accent-color:var(--or)}
#mobile-action-sheet{position:fixed;inset:0;z-index:70;justify-content:center;backdrop-filter:blur(3px)}
#mobile-action-sheet>div{max-width:430px;max-height:94dvh;box-sizing:border-box}
#mobile-action-sheet h2{margin-bottom:6px}
#mobile-action-sheet p{font-size:12px;margin-bottom:16px}
#mobile-action-sheet .opt{gap:14px;min-height:60px}
#mobile-action-sheet .opt>.icon{color:var(--or);flex:none}
#mobile-action-sheet .opt small{display:block;font-size:11px;font-weight:400;margin-top:3px}
#mobile-action-sheet button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.rd-mobile .dist-current-stop{
 margin:12px 0;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);
}
.rd-mobile .dist-current-stop h3{margin:0 0 4px}
.rd-mobile .dist-current-stop p{margin:4px 0;overflow-wrap:anywhere}
.rd-mobile .dist-current-stop .actions{margin-top:8px}
#content>.btn[data-act=back],.rd-mobile>.btn[data-act=back]{margin-block-end:12px}
.account-actions .di{padding:14px 16px;gap:12px}
.file{flex-wrap:wrap}
.file>.mobile-file-details{flex:1 1 11rem}
.file>.mobile-file-actions,.mobile-photo-actions{display:flex;flex:0 1 auto;flex-wrap:wrap;gap:7px}
.file .mobile-file-actions .btn{margin:0;min-height:44px}
.file b{font-size:var(--mobile-detail,14px)}
.mobile-photo-actions{margin-block-start:9px}

:is(#modal,#rd-mobile-form) .mls-photo-preview{box-sizing:border-box}
html{--mobile-heading:18px;--mobile-detail:14px;--mobile-meta:13px;--mobile-card-title:15px;--mobile-setting:12px}

html main{font-size:1.1em}
html[data-size=large] main{font-size:1.25em}
html .section h2,html .sheet-head h2{font-size:var(--mobile-heading)}
html .section p,html .kv dd,html .step b,html .btn,html .account-actions .di{font-size:var(--mobile-detail)}
html .muted,html .card-stage,html .section-label,html .kv dt,html .file .muted{font-size:var(--mobile-meta)}

@media(forced-colors:none){
 input[type=checkbox]{appearance:none;display:inline-grid;place-items:center;width:20px;height:20px;flex:none;border:1px solid var(--mu);border-radius:5px;background:var(--card);vertical-align:middle}
 input[type=checkbox]:checked{background:var(--or);border-color:var(--or)}
 input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
 input[type=checkbox]:focus-visible{outline:2px solid var(--or);outline-offset:2px}

}
#mobile-file-preview{width:min(92vw,680px);max-height:92dvh;overflow:auto;padding:15px;border:1px solid var(--ln);border-radius:18px;background:var(--card);color:var(--ink)}

#mobile-file-preview iframe{height:65dvh}

.mls-task-detail header .stats,.mls-task-editing #nav,.mls-task-editing [data-act=back],
.mls-task-editing header :is([data-act=tab],[data-act=language],[data-act=appearance]){display:none!important}

.mls-current-entry{font-size:12px;color:var(--mu)}
.mls-saved-tasks{margin-block-end:12px}
.mls-saved-tasks summary{font-weight:700;min-height:38px;align-content:center}
.mls-task-progress{display:grid;gap:5px;margin:10px 0;padding:12px;border:1px solid var(--ln);border-inline-start:3px solid var(--or);border-radius:10px;background:var(--bg);color:var(--ink)}
.mls-task-progress :is(p,ul){margin:0}
.mls-task-progress p{font-weight:700}
.mls-task-progress ul{padding-inline-start:21px;overflow-wrap:anywhere}

.mls-task-progress .btn,.mobile-photo-actions .btn,.file .mobile-file-actions .btn{min-height:44px}
#app .rd-task-decisions button{min-height:44px;min-width:0;white-space:normal}
html[data-theme=light] #app :is(#nav button.on,.appearance-row .seg button.on){color:#9d3e0b}

.account-actions .di,.mls-task-progress :is(strong,p,li){text-align:start}

  if (kind === 'task' && request.taskAction === 'handoff') fields += field(t('الزميل المستلم', 'Recipient'), '<input name="targetAccountId">');

function demoAction(target, {request, values, files}, account) {
  const {kind, taskAction} = request;
  const office = account.role === 'office';
  const key = request.permitKey || request.stageKey || kind;
  const claimKey = (request.permitKey ? 'permit:' : 'stage:') + key;
  const event = demoEvent(account, key, values.notesAr);
  if (office && kind === 'task') {
    const owner = taskAction === 'claim' ? account : demoOffices.find(person => person.id === values.targetAccountId);
    if (!owner) throw demoError('اختار زميل من القائمة.');
    const history = target.officeTasks[claimKey]?.history || [];
    target.officeTasks[claimKey] = {status: 'active', claimedBy: owner.id, actor: owner.name, startedAt: event.at, history: [...history, event]};
    return;
  }
  if (files.length) {
    for (const [index, file] of files.entries()) {
      const id = 'sample-upload-' + demoRevision + '-' + index;
      const url = URL.createObjectURL(new Blob([Uint8Array.from(atob(file.content), char => char.charCodeAt(0))]));
      demoFiles.set(id, {name: file.name, url});
      target.documents.push({id, name: file.name, stageKey: key, at: event.at});
    }
  }
  if (office) {
    if (values.state === 'pending') {
      (target.logs ||= []).push(event);
      return;
    }
    const claim = target.officeTasks[claimKey];
    if (claim) {
      claim.status = 'done';
      claim.history.push(event);
    }
    (target.logs ||= []).push(event);
    Object.assign(target, {current: false, canAct: false, status: 'done'});
    if (target.id === 'sample-allocation') {
      Object.assign(demoTasks.find(task => task.id === 'sample-pickup'), {canAct: true, status: 'active'});
    }
    if (target.id === 'sample-pickup') target.pickupReady = true;
    return;
  }
  if (kind === 'expense') {
    (target.expenses ||= []).push({nameAr: values.expenseName, amount: values.amount, currency: 'EGP', payerType: 'employee', bearerType: 'mls'});
  } else if (kind === 'incident' || kind === 'routeRequest') {
    (target.incidents ||= []).push({...event, reason: values.notesAr});
  } else if (kind === 'stage') {
    target.events.push(event);
    target.current.event = event;
    if (values.outcome === 'return') {
      Object.assign(target, {assignmentState: 'returned', current: null, canAct: false});
      return;
    }
    target.current = target.stages[target.stages.indexOf(target.current) + 1] || null;
    target.canAct = target.current?.roleKey === 'driver';
  }
}

function demoApi(url, payload, account, lang) {
  const [route, query] = url.split('?');
  if (route === '/api/login') {
    const user = {driver: demoDriver, office: demoOffices[0]}[payload.username];
    if (!user) throw demoError('اختار دور للمعاينة.', 401);
    return {token: 'design-preview', account: structuredClone(user)};
  }
  if (route === '/api/logout') return {};
  if (!account) throw demoError('اختار دور للمعاينة.', 401);
  if (route === '/api/state') {
    if (Number(new URLSearchParams(query).get('revision')) === demoRevision) return {unchanged: true};
    const driver = account.role === 'driver';
    return structuredClone({
      account, initialized: true, revision: demoRevision, trips: driver ? demoTrips : demoOfficeTrips,
      tasks: driver ? [] : demoTasks, points: [], officePeople: demoOffices
    });
  }
  const request = payload?.request;
  const target = request && demoTarget(request, account);
  if (!target) throw demoError('المهمة غير متاحة في المعاينة.', 404);
  if (route === '/api/form') return demoForm(target, request, lang === 'en');
  if (route === '/api/action') {
    demoAction(target, payload, account);
    demoRevision++;
    return {};
  }
  throw demoError('الإجراء غير متاح في المعاينة.', 404);
}

 function route(t){let next;
  const key=t.current?.key||'';
  if(t.current?.stopId)next=t.stops.find(s=>s.id===t.current.stopId)?.point;
  else if(key.startsWith('legDepart-'))next=t.stops.find(s=>s.id===key.slice(10))?.point;
  else if(/toPickup|pickupArrival|emptyPickup/.test(key)||key==='generator'&&t.service==='export')next=t.pickupYard;
  else if(/dryArrival|customs/.test(key)&&t.customsPlace==='dry')next=t.dryPort;
  else if(key==='customs'&&t.service==='export')next=t.customsPoint||t.loadingPoint;
  else if(t.service==='export'&&['emptyDepart','toLoading','loadingArrival','preload','loaded','approval'].includes(key))next=t.loadingPoint||{addressAr:t.loadingAddress,navigationQuery:t.loadingAddress};
  else if(key==='dryDepart'||/toPort|portArrival|seaArrival|originals|ladenDrop|agency|arrivalPort|broker|^gate$/.test(key))next=t.port;
  else if(/return|^empty$/.test(key))next=t.returnYard;

  if(retained.length&&evidence){form.querySelector('p.queued')?.remove();const more=document.createElement('details');more.className='ep-file-change';more.innerHTML='<summary>'+T('استبدال الصورة أو اختيار ملف محفوظ','Replace the image or choose a saved file')+'</summary>';evidence.before(more);more.append(evidence);}
 };
 const legacy=entry=>entry?.request?.kind==='stage'&&entry.request.scope==='order'&&entry.request.stageKey==='allocation'&&!Object.hasOwn(entry,'selection')&&!entry.exportTaskPart&&(state.data?.tasks||[]).some(t=>t.exportPortTasks&&t.recordId===entry.request.id);
 async function upgrade(entry){
  if(!legacy(entry))return false;const files=entry.files||[],groups=[['allocation','permit_booking'],['pickupReady','permit_withdrawal']];
  const saved=await stored('cache','export-port-original:'+entry.eventId);const archive=saved||{original:structuredClone(entry),parts:groups.map(([key])=>({key,eventId:uuid()}))};
  await stored('cache','export-port-original:'+entry.eventId,archive);
  for(const [key,evidence]of groups){const eventId=archive.parts.find(p=>p.key===key).eventId;if(await stored('outbox',eventId))continue;const part={...entry,eventId,request:{kind:'stage',scope:'order',id:entry.request.id,stageKey:key},exportTaskPart:key,sourceEventId:entry.eventId,status:'needsReview',label:key==='allocation'?T('استكمال الإذن والتخصيص','Complete permit and allocation'):T('استكمال إذن السحب والساحة','Complete pickup permit and yard'),error:T('الصورة محفوظة؛ افتح المهمة وأكد الاستلام.','Image retained; open the task and confirm receipt.'),values:{...entry.values,outcome:'approve',epPermitReceived:false},files:files.filter(f=>f.evidence===evidence)};await stored('outbox',eventId,part);}
  await remove('outbox',entry.eventId);await refreshQueue();render();toast(T('فُصلت النتيجة إلى مهمتين. الصور والطلب الأصلي محفوظان؛ ابدأ باستكمال الإذن والتخصيص.','Split into two tasks; files and the original are retained. Complete allocation first.'));return true;
 }
 async function review(entry){
  if(await upgrade(entry))return;const accountId=state.account.id;const currentState=await api('/api/state?revision=-1&account='+encodeURIComponent(accountId));if(state.account?.id!==accountId)return;state.data=currentState;await stored('cache','state:'+accountId,currentState);const task=taskFor(entry.request);if(!task?.current||!task.canAct){toast(T('هذه المهمة تنتظر الخطوة السابقة أو اكتملت؛ راجع المهام الحالية.','This task is waiting or complete; review current tasks.'));return}
  const cl=task.claim;if(cl?.status==='active'&&cl.claimedBy!==state.account.id){toast(T('المهمة عند ','Task is held by ')+cl.actor+T('؛ افتحها واستلمها بتسليم موثق.','; open it for a documented handoff.'));state.tab='home';state.selected={type:'task',id:task.id};render();return}
  if(cl?.status!=='active'){
   const r={...entry.request,kind:'task',targetKind:entry.request.kind,taskAction:'claim'},model=await api('/api/form',{request:r,lang:state.lang});await api('/api/action',{eventId:uuid(),request:r,values:{},files:[],recordVersion:model.recordVersion,revision:model.revision,occurredAt:new Date().toISOString()});state.data=await api('/api/state?revision=-1&account='+encodeURIComponent(state.account.id));
  }
  const current=taskFor(entry.request);state.tab='home';state.selected={type:'task',id:current.id};render();await openForm(entry.request,entry.values,entry);

 // Review is invoked from the saved result inside its task.
 document.addEventListener('click',e=>{const b=e.target.closest('[data-ep-next-group]');if(!b)return;e.preventDefault();if(taskNavigationLocked())return;closeForm();state.tab='home';state.selected=null;state.filter=b.dataset.epNextGroup;render();});

})();

/* MLS-EXPORT-PORT-MOBILE-END */

/* MLS-INLINE-TASK-PROGRESS-START */
function sameMobileRequest(a,b){
 return a&&b&&['kind','scope','id','stageKey','permitKey','documentId','taskAction'].every(key=>(a[key]||'')===(b[key]||''));
}
function taskNavigationLocked(){
 return !!state.selected&&['stage','permit','task'].includes(state.form?.request.kind);
}
function lockTaskNavigation(active){
 const locked=active&&taskNavigationLocked();
 $('app').classList.toggle('mls-task-editing',locked);
 const formState=$('native-form');
 const footer=formState?.previousElementSibling;
 if(!locked||!footer)return;
 footer.querySelector('[data-act=closeForm]')?.setAttribute('hidden','');
 const status=document.createElement('span');status.className='mls-current-entry';
 status.textContent=T('أكمل الخطوة الحالية','Complete the current step');footer.append(status);
}
function selectionForSavedTask(entry){
 const request=entry.request,data=state.data;
 if(!data||!request)return null;
 if(entry.selection?.type==='task'&&data.tasks?.some(task=>task.id===entry.selection.id))return entry.selection;
 if(entry.selection?.type==='trip'&&data.trips?.some(trip=>trip.id===entry.selection.id))return entry.selection;
 const task=data.tasks?.find(task=>task.recordId===request.id&&task.scope===request.scope&&
  (request.permitKey?task.permitKey===request.permitKey:request.stageKey?task.stage.key===request.stageKey:task.current));
 if(task)return {type:'task',id:task.id};
 return data.trips?.some(trip=>trip.id===request.id)?{type:'trip',id:request.id}:null;
}
function selectSavedTask(entry){
 const selected=selectionForSavedTask(entry);
 if(!selected)return false;
 state.tab='home';state.selected=selected;render();window.scrollTo(0,0);
 return true;
}
async function reviewSavedTask(entry){
 if(exportTasks.isLegacy(entry)||entry.exportTaskPart){await exportTasks.review(entry);return;}
 await poll(true);
 if(!state.account||!state.queue.some(saved=>saved.eventId===entry.eventId))return;
 const selected=selectionForSavedTask(entry);
 if(selected&&!selectSavedTask(entry))return;
 await openForm(entry.request,entry.values,entry);
}
function progressCard(entry,inline){
 const pending=entry.status==='pending',action='data-id="'+esc(entry.eventId)+'"';
 const reasons=String(entry.error||'').split(/[،؛;\n]+/).map(value=>value.trim()).filter(Boolean);
 const status=pending?T(state.online?'محفوظة · جارٍ الإرسال':'محفوظة · بانتظار الاتصال',state.online?'Saved · sending':'Saved · awaiting connection'):T('تحتاج استكمال','Needs review');
 const controls=inline?(pending?'':button(T('مراجعة النتيجة','Review result'),'review',action,'outline')):
  (selectionForSavedTask(entry)?button(T('فتح المهمة','Open task'),'resumeSavedTask',action,'outline'):pending?'':button(T('مراجعة النتيجة','Review result'),'review',action,'outline'));
 return '<article class="mls-task-progress '+(pending?'is-pending':'needs-review')+'"><strong>'+esc(entry.label||T('نتيجة المهمة','Task result'))+'</strong><p role="status">'+esc(status)+'</p>'+
  (reasons.length?'<ul>'+reasons.map(reason=>'<li>'+esc(reason)+'</li>').join('')+'</ul>':'')+
  (controls?'<div class="actions">'+controls+'</div>':'')+'</article>';
}
function renderTaskProgress(){
 const content=$('content'),selected=state.selected;
 $('app').classList.toggle('mls-task-detail',!!selected);
 if(!state.queue.length)return;
 if(!selected){
  if(state.tab==='home')content.insertAdjacentHTML('afterbegin','<details class="section mls-saved-tasks"><summary>'+
   T('مهام محفوظة تحتاج متابعة','Saved tasks to follow up')+' · '+state.queue.length+'</summary>'+state.queue.map(entry=>progressCard(entry,false)).join('')+'</details>');
  return;
 }
 const current=taskSelection();
 const entries=state.queue.filter(entry=>{
  const found=selectionForSavedTask(entry);
  return found?.id===selected.id&&found?.type===selected.type||
   !found&&entry.request.id===current.id&&(selected.type==='trip'||sameMobileRequest(entry.request,stageRequest()));
 });
 if(!entries.length)return;
 const host=$('rd-mobile-form'),panel=host?.closest('.rd-mobile-current');
 (host||content).insertAdjacentHTML(host?'beforebegin':'afterbegin',entries.map(entry=>progressCard(entry,true)).join(''));
 if(entries.some(entry=>sameMobileRequest(entry.request,stageRequest()))){
  panel?.querySelectorAll('.rd-open-task,[data-act=startTask]').forEach(button=>button.hidden=true);
 }
}
function openSelectedTask(){
 if(!state.account||!state.selected||state.form||state.busy||acceptedTask?.selection===state.selected)return;
 const selected=taskSelection(),request=stageRequest(),claim=currentTaskClaim(request);
 if(!(selected.task?selected.task.canAct:selected.trip?.canAct)||state.queue.some(entry=>sameMobileRequest(entry.request,request)))return;
 if(state.account.role==='driver'||claim?.status==='active'&&claim.claimedBy===state.account.id)void openForm(request);
}
function advanceTask(){
 if(!acceptedTask||!state.account||!state.data||state.busy)return;
 if(state.selected!==acceptedTask.selection){acceptedTask=null;return;}
 if(state.data.revision===acceptedTask.revision&&sameMobileRequest(stageRequest(),acceptedTask.request))return;
 const {request}=acceptedTask;acceptedTask=null;
 if(state.selected?.type==='task'&&!taskSelection().task?.canAct){
  const next=state.data.tasks?.find(task=>task.scope===request.scope&&task.recordId===request.id&&task.canAct&&task.claim?.status==='active'&&task.claim.claimedBy===state.account.id);
  if(next){state.selected={type:'task',id:next.id};render();}
 }
 if(!sameMobileRequest(stageRequest(),request))openSelectedTask();
}
/* MLS-INLINE-TASK-PROGRESS-END */

/* MLS-FILE-ACTION-SHEET-START */
/* Theme-aware file actions. Replacements are picked separately until confirmed. */
const {open:openMobileFileSheet,close:closeMobileFileSheet}=(() => {
 const bypass=new WeakSet(),pending=new WeakMap();let close=null;
 let cancelReplacement=null;
 function open(input,replace){
  if(close)close();pending.get(input)?.();
  cancelReplacement?.();
  const host=document.createElement('div');host.id='mobile-action-sheet';host.className='sh in';
  const panel=document.createElement('div');panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-labelledby','mobile-file-sheet-title');
  const heading=document.createElement('h2');heading.id='mobile-file-sheet-title';heading.textContent=replace?T('تعديل الصورة','Edit photo'):T('إضافة صورة أو مستند','Add a photo or document');panel.append(heading);
  const hint=document.createElement('p');hint.className='muted';hint.textContent=replace?T('استبدل الصورة أو أعد تصويرها','Replace or retake the photo'):T('اختَر طريقة إرفاق الملف','Choose how to attach your file');panel.append(hint);
  const accept=input.getAttribute('accept')||'',images=replace||!accept||/image\/|\.(png|jpe?g|webp|heic)\b/i.test(accept);
  const imageAccept=accept.split(',').map(s=>s.trim()).filter(s=>/^image\//i.test(s)||/^\.(png|jpe?g|webp|heic)$/i.test(s)).join(',')||'image/*';
  const previousFocus=document.activeElement,overflow=document.body.style.overflow;let closed=false;
  close=()=>{if(closed)return;closed=true;host.remove();document.body.style.overflow=overflow;if(previousFocus?.isConnected)previousFocus.focus();close=null;};
  const dismiss=close;
  function choose(kind){
   dismiss();if(!input.isConnected||input.disabled)return;
   if(replace){
    const picker=document.createElement('input');picker.type='file';picker.accept=imageAccept;picker.hidden=true;
    if(kind==='camera')picker.setAttribute('capture','environment');
    const cleanup=()=>{picker.remove();cancelReplacement=null;};
    picker.addEventListener('change',()=>{const file=picker.files[0];cleanup();if(file&&isPhoto(file))replace(file);else if(file)toast(T('اختَر ملف صورة.','Choose an image file.'));},{once:true});
    picker.addEventListener('cancel',cleanup,{once:true});
    document.body.append(picker);cancelReplacement=cleanup;picker.click();return;
   }
   const capture=input.getAttribute('capture');
   const restore=()=>{if(accept)input.setAttribute('accept',accept);else input.removeAttribute('accept');if(capture!==null)input.setAttribute('capture',capture);else input.removeAttribute('capture');input.removeEventListener('change',restore);input.removeEventListener('cancel',restore);pending.delete(input);};
   pending.set(input,restore);input.addEventListener('change',restore,{once:true});input.addEventListener('cancel',restore,{once:true});
   if(kind==='camera'){input.accept=imageAccept;input.setAttribute('capture','environment');}else{input.removeAttribute('capture');if(kind==='gallery')input.accept=imageAccept;}
   bypass.add(input);try{input.click();}finally{bypass.delete(input);}
  }
  for(const [kind,label,description,glyph] of [...(images?[
   ['camera',replace?T('إعادة التصوير','Retake photo'):T('التقاط صورة','Take a photo'),T('افتح الكاميرا','Open the camera'),'cam'],
   ['gallery',replace?T('استبدال من الصور','Replace from photos'):T('اختيار من الصور','Choose from photos'),T('صورة محفوظة على الموبايل','A photo saved on your phone'),'box']]:[]),
   ...(!replace?[['file',T('اختيار ملف','Choose a file'),T('المستندات والملفات المسموح بها','Supported documents and files'),'doc']]:[])]){
   const button=document.createElement('button');button.type='button';button.className='opt';button.dataset.fileSource=kind;
   button.innerHTML=icon(glyph,22);const text=document.createElement('span'),strong=document.createElement('b'),small=document.createElement('small');strong.textContent=label;small.textContent=description;text.append(strong,small);button.append(text);button.addEventListener('click',()=>choose(kind));panel.append(button);
  }
  const cancel=document.createElement('button');cancel.type='button';cancel.className='btn outline full';cancel.textContent=T('إلغاء','Cancel');cancel.addEventListener('click',dismiss);panel.append(cancel);host.append(panel);document.body.append(host);document.body.style.overflow='hidden';
  host.addEventListener('click',e=>{if(e.target===host)dismiss();});
  host.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();dismiss();}if(e.key==='Tab'){const buttons=[...panel.querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  panel.querySelector('button').focus();
 }
 document.addEventListener('click',e=>{
  const choose=e.target.closest('#native-form .doc-choose-files');
  const input=choose?.closest('.doc-file-picker')?.querySelector('input[type=file]:not([data-doc-replacement])')||e.target.closest('#native-form input[type=file]');
  if(!input||input.disabled||bypass.has(input))return;
  e.preventDefault();e.stopImmediatePropagation();open(input);
 },true);
 return {open,close(){close?.();cancelReplacement?.();}};
})();
/* MLS-FILE-ACTION-SHEET-END */
 window.MLS_MOBILE={state,api,poll,openForm,flush,stored,refreshQueue,showOriginalEntry};
